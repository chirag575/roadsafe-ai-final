# Heap is capped at 2G and the worker count at 2 on purpose. This machine has
# ~15 GB total but is often down to a couple of GB free, and the previous
# -Xmx4096m + parallel + workers.max=4 combination made the Gradle daemon fail
# to allocate native memory ("insufficient memory for the Java Runtime
# Environment"). Each failure left a hs_err_pid*.log/replay_pid*.log pair in
# android/. Both patterns are now git-ignored; see .gitignore.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.workers.max=2
org.gradle.daemon=true
android.useAndroidX=true
android.enableJetifier=true