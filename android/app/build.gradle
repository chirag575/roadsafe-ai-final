plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// Machine-local settings (Flutter SDK path, API keys). `local.properties` is
// git-ignored, so values such as MAPS_API_KEY never reach source control.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// A key passed with -PMAPS_API_KEY=... (or set in android/gradle.properties)
// still wins over the default, but real keys belong in local.properties.
def mapsApiKey = localProperties.getProperty('MAPS_API_KEY')
        ?: project.findProperty('MAPS_API_KEY')
        ?: "REPLACE_WITH_ANDROID_MAPS_API_KEY"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.roadsafe.ai.program2"
    compileSdk = 35
    ndkVersion = "27.3.13750724"

    defaultConfig {
        applicationId = "com.roadsafe.ai.program2"
        minSdk = 23
        targetSdk = 35
        versionCode = 2
        versionName = "1.1.0"

        manifestPlaceholders = [
            MAPS_API_KEY: mapsApiKey,
            applicationName: "android.app.Application"
        ]
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfigs {
                    release {
                        keyAlias keystoreProperties['keyAlias']
                        keyPassword keystoreProperties['keyPassword']
                        storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                        storePassword keystoreProperties['storePassword']
                    }
                }
                signingConfig = signingConfigs.release
            } else {
                // Local builds remain possible until a production keystore is configured.
                signingConfig = signingConfigs.debug
            }
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
