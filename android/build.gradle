// Plugin versions are declared in settings.gradle under `pluginManagement`,
// so they must not be repeated on the root buildscript classpath: declaring
// AGP and the Kotlin plugin in both places is the legacy pattern and is what
// produced "plugin already on the classpath with an unknown version".
plugins {
  // ...

  // Add the dependency for the Google services Gradle plugin
  id "com.google.gms.google-services" version "4.4.2" apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
